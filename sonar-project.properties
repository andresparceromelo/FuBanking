# =====================================================================
#  Configuración de análisis SonarCloud - Proyecto FuBanking
# =====================================================================
#  El motor de SonarCloud usa este archivo para saber QUÉ analizar.
#  La organización y la clave de proyecto se asignan automáticamente
#  al conectar el repo en sonarcloud.io (Automatic Analysis).
#  Si más adelante pasas a análisis por CI, descomenta estas dos líneas
#  y pon los valores que te muestre SonarCloud:
# sonar.organization=TU_ORGANIZATION_KEY
# sonar.projectKey=TU_ORGANIZATION_KEY_FuBanking

sonar.projectName=FuBanking
sonar.projectVersion=1.0

# ---- Código de producción que sí queremos medir ----
sonar.sources=backend/src,frontend/src

# ---- Lo que NO se analiza (ruido / generado / carpeta vieja) ----
sonar.exclusions=**/node_modules/**,**/tests/**,fronted/**,frontend/.next/**,backend/dist/**,**/*.d.ts,**/*.tsbuildinfo

sonar.sourceEncoding=UTF-8

# =====================================================================
#  COBERTURA (opcional, para más adelante)
#  Cuando quieras el % de cobertura, se envuelven los tests con c8 para
#  generar el LCOV y se descomenta esto:
# sonar.tests=backend/src/tests,frontend/src/tests
# sonar.test.inclusions=**/tests/**/*.ts
# sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info
# =====================================================================
