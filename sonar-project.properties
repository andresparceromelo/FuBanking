# =====================================================================
#  Configuración de análisis SonarCloud - Proyecto FuBanking
# =====================================================================
#  IMPORTANTE: verifica estos dos valores en SonarCloud
#  (Project -> icono (i) de Información, o Administration -> Analysis Method).
#  La 'organization' es la clave de tu organización (ej. alejodev11) y la
#  'projectKey' debe coincidir con el que crees en tu SonarQube local.
#  Nota: sonar.organization no se usa en SonarQube local (solo en SonarCloud).
sonar.projectKey=FuBank
sonar.host.url=http://localhost:9000

sonar.projectName=FuBanking
sonar.projectVersion=1.0


sonar.sources=backend/src,frontend/src

# ---- Lo que NO se analiza (ruido / generado / carpeta vieja / tests) ----
sonar.exclusions=**/node_modules/**,**/tests/**,frontend/.next/**,backend/dist/**,backend/coverage/**,backend/coverage-bolsillos/**,frontend/coverage/**,**/*.d.ts,**/*.tsbuildinfo

sonar.sourceEncoding=UTF-8

# ---- COBERTURA (dos herramientas conviviendo) ----
#  Vitest backend (resto de modulos): backend/coverage/lcov.info
#  c8 (modulo Bolsillos):             backend/coverage-bolsillos/lcov.info
#  Vitest frontend (modulo Creditos): frontend/coverage/lcov.info
#  Sonar fusiona la cobertura de todos los reportes.
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,backend/coverage-bolsillos/lcov.info,frontend/coverage/lcov.info
