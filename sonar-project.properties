# =====================================================================
#  Configuración de análisis SonarCloud - Proyecto FuBanking
# =====================================================================
#  IMPORTANTE: verifica estos dos valores en SonarCloud
#  (Project -> icono (i) de Información, o Administration -> Analysis Method).
#  La 'organization' es la clave de tu organización (ej. alejodev11) y la
#  'projectKey' suele ser <organization>_<repo>.
sonar.organization=alejodev11
sonar.projectKey=AlejoDev11_FuBanking
sonar.host.url=https://sonarcloud.io

sonar.projectName=FuBanking
sonar.projectVersion=1.0


sonar.sources=backend/src,frontend/src

# ---- Lo que NO se analiza (ruido / generado / carpeta vieja / tests) ----
sonar.exclusions=**/node_modules/**,**/tests/**,fronted/**,frontend/.next/**,backend/dist/**,backend/coverage/**,**/*.d.ts,**/*.tsbuildinfo

sonar.sourceEncoding=UTF-8

# ---- COBERTURA (LCOV generado por c8) ----
#  Se genera con:  cd backend && npm run test:coverage
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info
